# Google Cloud Build -> Cloud Run. Replace PROJECT_ID and REGION before running:
#   gcloud builds submit --config=cloudbuild.yaml .
steps:
  - name: "gcr.io/cloud-builders/docker"
    args: ["build", "-t", "gcr.io/$PROJECT_ID/falsify", "."]
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/falsify"]
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - run
      - deploy
      - falsify
      - --image=gcr.io/$PROJECT_ID/falsify
      - --region=us-central1
      - --platform=managed
      - --allow-unauthenticated
      - --set-env-vars=GEMINI_MODEL=gemini-3.6-flash
      - --set-secrets=GEMINI_API_KEY=GEMINI_API_KEY:latest
images:
  - gcr.io/$PROJECT_ID/falsify
