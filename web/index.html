<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Falsify — settlement for verifiable AI work</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#58a6ff;--green:#3fb950;--red:#f85149;--amber:#d29922}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:1080px;margin:0 auto;padding:0 1.25rem}
header{border-bottom:1px solid var(--border);padding:1rem 0;position:sticky;top:0;background:rgba(13,17,23,.92);backdrop-filter:blur(6px);z-index:5}
.brand{display:flex;align-items:center;gap:.75rem}
.logo{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,#58a6ff,#8b5cf6);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:#fff}
.brand h1{font-size:1.15rem;margin:0;letter-spacing:-.01em}
.brand .sub{color:var(--muted);font-size:.8rem}
nav{display:flex;gap:.25rem;margin-top:.8rem;flex-wrap:wrap}
nav button{background:transparent;border:1px solid transparent;color:var(--muted);padding:.5rem .9rem;border-radius:8px;cursor:pointer;font:inherit;font-size:.9rem}
nav button.active{color:var(--text);background:var(--panel);border-color:var(--border)}
main{padding:1.5rem 0 4rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.9rem;margin-bottom:1.5rem}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:1rem}
.stat .k{color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
.stat .v{font-size:1.5rem;font-weight:700;margin-top:.25rem}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:1.25rem;margin-bottom:1rem}
.panel h2{margin:0 0 1rem;font-size:1.05rem}
label{display:block;margin:.7rem 0 .25rem;font-weight:600;font-size:.88rem;color:var(--muted)}
input,select,textarea{width:100%;padding:.6rem;font:inherit;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text)}
textarea{resize:vertical;min-height:56px}
.row{display:flex;gap:.8rem}
.row>div{flex:1}
button.btn{background:var(--accent);color:#04121f;border:0;padding:.62rem 1.05rem;border-radius:8px;cursor:pointer;font:inherit;font-weight:600}
button.btn:disabled{opacity:.5;cursor:wait}
button.ghost{background:transparent;border:1px solid var(--border);color:var(--text);padding:.5rem .8rem;border-radius:8px;cursor:pointer;font:inherit}
.badge{display:inline-block;padding:.15rem .5rem;border-radius:999px;font-size:.74rem;font-weight:600;border:1px solid var(--border)}
.badge.falsified{color:var(--red);border-color:var(--red)}
.badge.open{color:var(--accent);border-color:var(--accent)}
.badge.survived{color:var(--green);border-color:var(--green)}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{text-align:left;padding:.6rem;border-bottom:1px solid var(--border)}
th{color:var(--muted);font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.03em}
tr:last-child td{border-bottom:none}
.muted{color:var(--muted)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.82rem}
.verdict-pill{padding:.15rem .5rem;border-radius:6px;font-weight:700;font-size:.8rem}
.verdict-pill.FALSIFIED{background:rgba(248,81,73,.15);color:var(--red)}
.verdict-pill.NOT_FALSIFIED{background:rgba(63,185,80,.15);color:var(--green)}
.empty{padding:2rem;text-align:center;color:var(--muted)}
pre{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:.9rem;overflow:auto;font-size:.8rem}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand">
      <div class="logo">F</div>
      <div>
        <h1>Falsify</h1>
        <div class="sub">Settlement for verifiable AI work</div>
      </div>
    </div>
    <nav id="nav">
      <button data-view="dashboard" class="active">Dashboard</button>
      <button data-view="publish">Publish</button>
      <button data-view="assertions">Assertions</button>
      <button data-view="reputation">Reputation</button>
      <button data-view="settlements">Settlements</button>
      <button data-view="evidence">Evidence</button>
    </nav>
  </div>
</header>
<main class="wrap" id="view"></main>
<script src="/app.js"></script>
</body>
</html>
